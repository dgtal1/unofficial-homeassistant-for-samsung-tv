# Dashboard "Przegląd" w stylu Apple Home – układ jak widok generowany w aplikacji TV.
#
# JAK UŻYĆ
# 1. HA: Ustawienia -> Dashboardy -> Dodaj dashboard (pusty). Zapamiętaj jego "URL" (np. dashboard-dom).
# 2. Otwórz go, ... -> Edytuj dashboard -> ... -> "Surowy edytor konfiguracji" i wklej całość.
# 3. Zamień WSZĘDZIE "/dashboard-dom/" na "/<twój-url>/" (dla domyślnego dashboardu: "/lovelace/").
# 4. Zamień encje oznaczone ZMIEŃ na swoje (nazwy encji są tu tylko przykładowe).
#
# Jak to działa:
# - kafelek z encją + tap_action navigate  = podsumowanie (stan encji = podpis i kolor kafelka),
# - przycisk bez encji + tap_action navigate = kafelek obszaru,
# - widoki z "subview: true" nie mają zakładki, otwiera się je kafelkiem (w aplikacji TV: OK, wstecz: RETURN).
# - kafelek robi się czerwony w aplikacji TV, gdy encja ma device_class safety/problem/smoke/gas... i stan "on".
title: Dom
views:
  # ---------------------------------------------------------------- widok główny
  - title: Przegląd
    path: przeglad
    type: sections
    max_columns: 1
    sections:
      - cards:
          - type: heading
            heading: "Podsumowania"
            heading_style: title
          - type: tile
            entity: light.zmien_grupa_swiatel
            name: "Światła"
            icon: mdi:lightbulb-group
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/swiatla
          - type: tile
            entity: sensor.zmien_srednia_temperatura
            name: "Klimat"
            icon: mdi:thermometer
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/klimat
          - type: tile
            entity: binary_sensor.zmien_bezpieczenstwo
            name: "Bezpieczeństwo"
            icon: mdi:shield-home
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/bezpieczenstwo
          - type: tile
            entity: media_player.zmien_glowny_odtwarzacz
            name: "Odtwarzacze"
            icon: mdi:speaker
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/odtwarzacze
          - type: tile
            entity: weather.zmien_pogoda
            name: "Pogoda"
      - cards:
          - type: heading
            heading: "Obszary"
            heading_style: title
          - type: button
            name: "Biuro"
            icon: mdi:desk
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-biuro
          - type: button
            name: "Garaż"
            icon: mdi:garage
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-garaz
          - type: button
            name: "Kuchnia"
            icon: mdi:silverware-fork-knife
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-kuchnia
          - type: button
            name: "Łazienka górna"
            icon: mdi:shower
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-lazienka-gorna
          - type: button
            name: "Ogród"
            icon: mdi:flower
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-ogrod
          - type: button
            name: "Pokój Olka"
            icon: mdi:bed
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-pokoj-olka
          - type: button
            name: "Przedpokój góra"
            icon: mdi:door
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-przedpokoj-gora
          - type: button
            name: "Salon"
            icon: mdi:sofa
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-salon
          - type: button
            name: "Sypialnia"
            icon: mdi:bed-king
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-sypialnia
          - type: button
            name: "Wejście"
            icon: mdi:door-open
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-dom/obszar-wejscie
